      /* Téma kitu pro runtime kompilátor (generuje sync-ui — NEEDITOVAT) */
      


@custom-variant dark (&:is(.dark *));

@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --font-sans: var(--font-geist-sans, ui-sans-serif, system-ui, sans-serif);
  --font-mono: var(--font-geist-mono, ui-monospace, monospace);
  --font-heading: var(--font-sans);
  --color-sidebar-ring: var(--sidebar-ring);
  --color-sidebar-border: var(--sidebar-border);
  --color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --color-sidebar-accent: var(--sidebar-accent);
  --color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --color-sidebar-primary: var(--sidebar-primary);
  --color-sidebar-foreground: var(--sidebar-foreground);
  --color-sidebar: var(--sidebar);
  --color-chart-5: var(--chart-5);
  --color-chart-4: var(--chart-4);
  --color-chart-3: var(--chart-3);
  --color-chart-2: var(--chart-2);
  --color-chart-1: var(--chart-1);
  --color-ring: var(--ring);
  --color-input: var(--input);
  --color-border: var(--border);
  --color-destructive: var(--destructive);
  --color-accent-foreground: var(--accent-foreground);
  --color-accent: var(--accent);
  --color-muted-foreground: var(--muted-foreground);
  --color-muted: var(--muted);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-secondary: var(--secondary);
  --color-primary-foreground: var(--primary-foreground);
  --color-primary: var(--primary);
  --color-popover-foreground: var(--popover-foreground);
  --color-popover: var(--popover);
  --color-card-foreground: var(--card-foreground);
  --color-card: var(--card);
  --radius-sm: calc(var(--radius) * 0.6);
  --radius-md: calc(var(--radius) * 0.8);
  --radius-lg: var(--radius);
  --radius-xl: calc(var(--radius) * 1.4);
  --radius-2xl: calc(var(--radius) * 1.8);
  --radius-3xl: calc(var(--radius) * 2.2);
  --radius-4xl: calc(var(--radius) * 2.6);
}

:root {
  
  --cc-brand-blue: #3478f6;
  --cc-brand-violet: #7c3fe4;
  --cc-brand-cyan: #38c8da;
  --cc-brand-green: #38bd8b;
  
  --cc-gradient: linear-gradient(
    125deg,
    var(--primary),
    var(--cc-brand-violet)
  );
  --cc-gradient-soft: linear-gradient(
    135deg,
    rgb(52 120 246 / 10%),
    rgb(124 63 228 / 8%)
  );
  --cc-sidebar: #061b39;
  --cc-sidebar-deep: #04152e;
  --cc-canvas: #f7f9fd;
  --cc-surface: #ffffff;
  --cc-text: #10254a;
  --cc-text-muted: #667797;
  --cc-border: #e1e7f1;
  --cc-radius-control: 0.72rem;
  --cc-radius-card: 0.85rem;
  --cc-shadow-card: 0 7px 24px rgb(17 37 75 / 7%);
  --cc-shadow-hover: 0 14px 36px rgb(17 37 75 / 12%);
  --cc-space-page: clamp(1.25rem, 2.6vw, 2.5rem);
  --cc-motion-fast: 210ms;
  --cc-motion-base: 360ms;
  --cc-motion-slow: 620ms;
  --cc-ease: cubic-bezier(0.22, 1, 0.36, 1);

  --background: var(--cc-canvas);
  --foreground: var(--cc-text);
  --card: var(--cc-surface);
  --card-foreground: var(--cc-text);
  --popover: var(--cc-surface);
  --popover-foreground: var(--cc-text);
  --primary: var(--cc-brand-blue);
  --primary-foreground: #fff;
  --secondary: #eff3fb;
  --secondary-foreground: var(--cc-text);
  --muted: #f1f4f9;
  --muted-foreground: var(--cc-text-muted);
  --accent: #edf3ff;
  --accent-foreground: var(--cc-text);
  --destructive: oklch(0.577 0.245 27.325);
  --border: var(--cc-border);
  --input: #dce4f0;
  --ring: var(--cc-brand-blue);
  --chart-1: oklch(0.87 0 0);
  --chart-2: oklch(0.556 0 0);
  --chart-3: oklch(0.439 0 0);
  --chart-4: oklch(0.371 0 0);
  --chart-5: oklch(0.269 0 0);
  --radius: var(--cc-radius-control);
  --sidebar: var(--cc-sidebar);
  --sidebar-foreground: #fff;
  --sidebar-primary: var(--cc-brand-violet);
  --sidebar-primary-foreground: #fff;
  --sidebar-accent: rgb(255 255 255 / 8%);
  --sidebar-accent-foreground: #fff;
  --sidebar-border: rgb(255 255 255 / 10%);
  --sidebar-ring: #8b72ff;
}

.dark {
  
  --background: #0a1626;
  --foreground: #e9effa;
  --card: #101f33;
  --card-foreground: #e9effa;
  --popover: #101f33;
  --popover-foreground: #e9effa;
  --primary: var(--cc-brand-blue);
  --primary-foreground: #fff;
  --secondary: #18293f;
  --secondary-foreground: #e9effa;
  --muted: #16263c;
  --muted-foreground: #93a5c1;
  --accent: #1b2f4b;
  --accent-foreground: #e9effa;
  --destructive: oklch(0.704 0.191 22.216);
  --border: #22344e;
  --input: #2a3f5c;
  --ring: var(--cc-brand-blue);
  --chart-1: var(--cc-brand-blue);
  --chart-2: var(--cc-brand-violet);
  --chart-3: var(--cc-brand-cyan);
  --chart-4: var(--cc-brand-green);
  --chart-5: #93a5c1;
  --cc-shadow-card: 0 7px 24px rgb(0 0 0 / 35%);
  --cc-shadow-hover: 0 14px 36px rgb(0 0 0 / 45%);
  --sidebar: var(--cc-sidebar-deep);
  --sidebar-foreground: #e9effa;
  --sidebar-primary: var(--cc-brand-violet);
  --sidebar-primary-foreground: #fff;
  --sidebar-accent: rgb(255 255 255 / 8%);
  --sidebar-accent-foreground: #fff;
  --sidebar-border: rgb(255 255 255 / 10%);
  --sidebar-ring: #8b72ff;
}

@keyframes cc-rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes cc-scale-in {
  from {
    opacity: 0;
    transform: scale(0.985);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@layer base {
  * {
    @apply border-border outline-ring/50;
  }
  body {
    @apply bg-background text-foreground;
  }
  html {
    @apply font-sans;
  }
}

@layer components {
  [data-slot='card'] {
    border-radius: var(--cc-radius-card);
    box-shadow: var(--cc-shadow-card);
    animation: cc-scale-in var(--cc-motion-base) var(--cc-ease) both;
    transition:
      transform var(--cc-motion-base) var(--cc-ease),
      box-shadow var(--cc-motion-base) var(--cc-ease),
      border-color var(--cc-motion-fast) ease;
  }

  [data-slot='card']:nth-child(2) {
    animation-delay: 45ms;
  }
  [data-slot='card']:nth-child(3) {
    animation-delay: 90ms;
  }
  [data-slot='card']:nth-child(4) {
    animation-delay: 135ms;
  }

  [data-slot='dialog-content'] {
    animation-duration: var(--cc-motion-base);
  }

  button,
  a,
  input,
  textarea,
  select {
    transition-duration: var(--cc-motion-fast);
    transition-timing-function: var(--cc-ease);
  }

  button,
  a[href],
  select,
  summary,
  label[for],
  [role='button'],
  [data-slot='switch'],
  input[type='checkbox'],
  input[type='radio'] {
    cursor: pointer;
  }

  input:not([type='checkbox']):not([type='radio']),
  textarea {
    cursor: text;
  }

  button:disabled,
  select:disabled,
  input:disabled,
  textarea:disabled,
  [aria-disabled='true'] {
    cursor: not-allowed;
  }

  [data-slot='button'] {
    transition-duration: var(--cc-motion-fast);
    transition-timing-function: var(--cc-ease);
  }
}

    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

            <div className="proto-panel py-12 text-center text-sm text-muted-foreground">
              Žádní zákazníci v tomto pohledu.
            </div>
          );
        }
        return (
          <div className="proto-panel overflow-hidden p-0">
            <Table>
              <TableHeader>
                <TableRow>
                  <TableHead>Jméno</TableHead>
                  <TableHead>E-mail</TableHead>
                  <TableHead>Segment</TableHead>
                  <TableHead>Stav</TableHead>
                  <TableHead className="w-16 text-right">Akce</TableHead>
                </TableRow>
              </TableHeader>
              <TableBody>
                {customers.map((c) => (
                  <TableRow key={c.id}>
                    <TableCell className="font-medium">{c.name}</TableCell>
                    <TableCell>{c.email}</TableCell>
                    <TableCell>{c.segment}</TableCell>
                    <TableCell>
                      <Badge variant={c.active ? "default" : "secondary"}>
                        {c.active ? "Aktivní" : "Neaktivní"}
                      </Badge>
                    </TableCell>
                    <TableCell className="text-right">
                      <Button variant="ghost" size="sm" onClick={() => onRemove(c.id)}>
                        Odebrat
                      </Button>
                    </TableCell>
                  </TableRow>
                ))}
              </TableBody>
            </Table>
          </div>
        );
      }

      function NewCustomerDialog({ onAdd }) {
        const [open, setOpen] = useState(false);
        const [name, setName] = useState("");
        const [email, setEmail] = useState("");

        const submit = (event) => {
          event.preventDefault();
          if (!name.trim() || !email.trim()) return;
          onAdd({ name: name.trim(), email: email.trim() });
          setName("");
          setEmail("");
          setOpen(false);
        };

        return (
          <Dialog open={open} onOpenChange={setOpen}>
            <DialogTrigger render={<Button />}>Nový zákazník</DialogTrigger>
            <DialogContent
              title="Nový zákazník"
              description="Zákazník se přidá jen do dat prototypu."
            >
              <form onSubmit={submit} className="grid gap-4">
                <Field>
                  <FieldLabel htmlFor="cust-name">Jméno</FieldLabel>
                  <Input
                    id="cust-name"
                    value={name}
                    onChange={(e) => setName(e.target.value)}
                    placeholder="Jana Nová"
                  />
                </Field>
                <Field>
                  <FieldLabel htmlFor="cust-email">E-mail</FieldLabel>
                  <Input
                    id="cust-email"
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder="jana@priklad.cz"
                  />
                </Field>
                <DialogFooter>
                  <Button type="submit">Přidat zákazníka</Button>
                </DialogFooter>
              </form>
            </DialogContent>
          </Dialog>
        );
      }

      function App() {
        const [customers, setCustomers] = useState(mockCustomers);

        const addCustomer = ({ name, email }) => {
          setCustomers((prev) => [
            ...prev,
            {
              id: Math.max(0, ...prev.map((c) => c.id)) + 1,
              name,
              email,
              segment: "Noví",
              active: true,
            },
          ]);
          toast.add({ title: "Zákazník přidán", description: `${name} byl uložen do prototypu.` });
        };

        const removeCustomer = (id) => {
          const c = customers.find((x) => x.id === id);
          setCustomers((prev) => prev.filter((x) => x.id !== id));
          toast.add({ title: "Zákazník odebrán", description: c ? c.name : undefined });
        };

        const active = customers.filter((c) => c.active);

        return (
          <main className="mx-auto flex max-w-3xl flex-col gap-6 p-6">
            <header className="flex items-center justify-between">
              <div>
                <h1 className="text-2xl font-semibold">Správa zákazníků</h1>
                <p className="text-sm text-muted-foreground">
                  Prototyp nad packages/ui — {customers.length} zákazníků
                </p>
              </div>
              <NewCustomerDialog onAdd={addCustomer} />
            </header>

            <Tabs defaultValue="aktivni">
              <TabsList>
                <TabsTrigger value="aktivni">Aktivní ({active.length})</TabsTrigger>
                <TabsTrigger value="vsichni">Všichni ({customers.length})</TabsTrigger>
              </TabsList>
              <TabsContent value="aktivni" className="mt-4">
                <CustomerTable customers={active} onRemove={removeCustomer} />
              </TabsContent>
              <TabsContent value="vsichni" className="mt-4">
                <CustomerTable customers={customers} onRemove={removeCustomer} />
              </TabsContent>
            </Tabs>

            <Toaster />
          </main>
        );
      }

      createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
